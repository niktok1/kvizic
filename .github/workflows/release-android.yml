# The Android release, from a phone: "Run workflow" bumps the version (patch by default) on main, tags it, and,
# once the owner approves in the `production` environment (GitHub Mobile), builds the signed bundle and uploads
# it to Play's internal track. promote-android.yml takes it on from there. A tag v1.2.3 pushed from a Mac
# releases that commit as it is, its version checked against the tag.
#
# Secrets of `production` (so nothing reads them unapproved): UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD,
# UPLOAD_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON. Variables: KVIZIC_POSTHOG_KEY, KVIZIC_PLAYGAMES_APP_ID,
# KVIZIC_PLAYGAMES_SERVER_CLIENT_ID (public: every bundle carries them). Never a pull request's code.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump (none releases main's version as it is)
        type: choice
        options: [patch, minor, major, none]
        default: patch
      notes_sr:
        description: Шта је ново (Serbian release notes)
        default: Исправке и побољшања.
      notes_en:
        description: What's new in English (blank for none)
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: release-android

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: CI is green on main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq .total_count) && break
            sleep 15
          done
          [ "${green:-0}" -gt 0 ] || { echo "::error::CI has no green run of main's $sha yet"; exit 1; }

      - name: Bump the version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tools/release/bump.py "$BUMP")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "chore(release): $version"
          git push -q origin HEAD:main
          # The workflow's token starts no CI run by its push: ask for one, so main stays checked.
          gh workflow run ci.yml --ref main

      - name: Tag it
        id: tag
        run: |
          version=$(tools/release/bump.py check)
          sha=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME, but the version is $version"; exit 1; }
          elif git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            [ "$(git rev-parse "v$version^{commit}")" = "$sha" ] || { echo "::error::v$version already tags another commit: bump"; exit 1; }
          else
            git tag "v$version" && git push -q origin "v$version"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **$version** from \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: The upload key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::UPLOAD_KEYSTORE_BASE64 is not set on the production environment"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # A bundle without these would ship with no analytics or no Play Games, and build all the same.
      - name: Build the signed bundle
        env:
          KVIZIC_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          KVIZIC_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KVIZIC_UPLOAD_KEY_ALIAS: kvizic-upload
          KVIZIC_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          POSTHOG_KEY: ${{ vars.KVIZIC_POSTHOG_KEY }}
          PLAYGAMES_APP_ID: ${{ vars.KVIZIC_PLAYGAMES_APP_ID }}
          PLAYGAMES_SERVER_CLIENT_ID: ${{ vars.KVIZIC_PLAYGAMES_SERVER_CLIENT_ID }}
        run: |
          for name in POSTHOG_KEY PLAYGAMES_APP_ID PLAYGAMES_SERVER_CLIENT_ID; do
            [ -n "${!name}" ] || { echo "::error::the repository variable KVIZIC_$name is not set"; exit 1; }
          done
          ./gradlew --no-daemon :app:androidApp:bundleProdRelease \
            -Pkvizic.posthog.key="$POSTHOG_KEY" \
            -Pkvizic.playgames.appId="$PLAYGAMES_APP_ID" \
            -Pkvizic.playgames.serverClientId="$PLAYGAMES_SERVER_CLIENT_ID"

      # Signed by the upload key and no other: its certificate's SHA-1 is LAUNCH.md's.
      - name: Check the signature
        run: |
          bundle=app/androidApp/build/outputs/bundle/prodRelease/androidApp-prod-release.aab
          jarsigner -verify "$bundle" | grep -q 'jar verified' || { echo "::error::the bundle's signature does not verify"; exit 1; }
          keytool -printcert -jarfile "$bundle" | grep -q 'SHA1: 7E:7E:42:7E:05:74:0F:B9:13:46:5A:B5:72:E7:4E:00:42:DE:94:76' \
            || { echo "::error::the bundle is not signed with the upload key"; exit 1; }
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: kvizic-${{ needs.prepare.outputs.version }}.aab
          path: app/androidApp/build/outputs/bundle/prodRelease/androidApp-prod-release.aab
          retention-days: 30

      - name: Upload to Play's internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          NOTES_SR: ${{ inputs.notes_sr || 'Исправке и побољшања.' }}
          NOTES_EN: ${{ inputs.notes_en }}
        run: |
          pip install -q -r tools/play/requirements.txt
          python3 tools/play/play.py upload app/androidApp/build/outputs/bundle/prodRelease/androidApp-prod-release.aab \
            --track internal --notes-sr "$NOTES_SR" --notes-en "$NOTES_EN" | tee -a "$GITHUB_STEP_SUMMARY"
