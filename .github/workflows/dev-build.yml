# A dev build on the owner's phone after every green push to main, wherever they are: the dev flavor
# (io.ntole.kvizic.dev, against kvizic-server-dev, beside the Play version) as a release build, sent through
# Firebase App Distribution, whose App Tester app notifies and installs it. Signed with the owner's own debug
# keystore, whose SHA-1 is already on the Play Games credential for io.ntole.kvizic.dev, so Play Games signs in
# on it, and it installs over a build from the Mac and back. Dev's data resets on every deploy.
#
# Secrets (repository): DEBUG_KEYSTORE_BASE64, FIREBASE_SERVICE_ACCOUNT_JSON. Variables: FIREBASE_APP_ID_DEV,
# and the ids release-android.yml uses. Never a pull request's code: only a push to main's green CI run.
name: Dev build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Off until Firebase is set up (FIREBASE_APP_ID_DEV), so no push fails for it.
    if: >-
      vars.FIREBASE_APP_ID_DEV != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Where the Android Gradle plugin looks for the debug key, which dev's builds always take.
      - name: The debug key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::DEBUG_KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -q 'SHA1: 88:5F:40:75:72:5E:1B:59:40:EE:5C:0E:09:48:CC:3E:34:B2:A3:4A' \
            || { echo "::error::that is not the owner's debug key, whose SHA-1 Play Games knows"; exit 1; }

      - name: Build
        env:
          POSTHOG_KEY: ${{ vars.KVIZIC_POSTHOG_KEY }}
          PLAYGAMES_APP_ID: ${{ vars.KVIZIC_PLAYGAMES_APP_ID }}
          PLAYGAMES_SERVER_CLIENT_ID: ${{ vars.KVIZIC_PLAYGAMES_SERVER_CLIENT_ID }}
        run: |
          ./gradlew --no-daemon :app:androidApp:assembleDevRelease \
            -Pkvizic.posthog.key="$POSTHOG_KEY" \
            -Pkvizic.playgames.appId="$PLAYGAMES_APP_ID" \
            -Pkvizic.playgames.serverClientId="$PLAYGAMES_SERVER_CLIENT_ID"

      - name: Send it to the phone
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APP_ID: ${{ vars.FIREBASE_APP_ID_DEV }}
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] && [ -n "$APP_ID" ] \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON or FIREBASE_APP_ID_DEV is not set"; exit 1; }
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          notes="$(git log -1 --format='%h %s') ($(date -u +%Y-%m-%d))"
          apk=$(ls app/androidApp/build/outputs/apk/dev/release/*.apk | head -1)
          npx --yes firebase-tools@15.32.1 appdistribution:distribute "$apk" \
            --app "$APP_ID" --groups owner --release-notes "$notes"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "Sent: $notes" >> "$GITHUB_STEP_SUMMARY"
